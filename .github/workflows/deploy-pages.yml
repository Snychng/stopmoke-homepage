name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建官网
        run: npm run build

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v5
